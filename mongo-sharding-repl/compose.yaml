services:
  configSrv:
    image: mongo:latest
    container_name: configSrv 
    restart: always
    ports:
      - "27017:27017"
    networks:
      - app-network
    volumes:
      - config-data:/data/db
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ] 
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  shard1a:
    image: mongo:latest
    container_name: shard1a
    command: [ "mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018" ]
    networks: [ app-network ]
    volumes: [ shard1a-data:/data/db ]

  shard1b:
    image: mongo:latest
    container_name: shard1b
    command: [ "mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018" ]
    networks: [ app-network ]
    volumes: [ shard1b-data:/data/db ]

  shard1c:
    image: mongo:latest
    container_name: shard1c
    command: [ "mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018" ]
    networks: [ app-network ]
    volumes: [ shard1c-data:/data/db ]

  shard2a:
    image: mongo:latest
    container_name: shard2a
    command: [ "mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019" ]
    networks: [ app-network ]
    volumes: [ shard2a-data:/data/db ]

  shard2b:
    image: mongo:latest
    container_name: shard2b
    command: [ "mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019" ]
    networks: [ app-network ]
    volumes: [ shard2b-data:/data/db ]

  shard2c:
    image: mongo:latest
    container_name: shard2c
    command: [ "mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019" ]
    networks: [ app-network ]
    volumes: [ shard2c-data:/data/db ]

  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27020:27020"
    networks:
      - app-network
    command:
      [
        "mongos",
        "--configdb", 
        "config_server/configSrv:27017",
        "--bind_ip_all",
        "--port",
        "27020"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    networks:
      - app-network
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"

networks:
  app-network:
    driver: bridge

volumes:
  config-data:
  shard1a-data:
  shard1b-data:
  shard1c-data:
  shard2a-data:
  shard2b-data:
  shard2c-data: